<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f4ef">
<title>手繪卡片收藏</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--panel:#fffefa;--ink:#222625;--muted:#707673;--line:#e3e5df;--accent:#287966;--accentText:#fff;--soft:#e8f3ee;--shadow:0 10px 36px #1a332019}
[data-theme=dark]{color-scheme:dark;--bg:#171c1a;--panel:#202725;--ink:#eef3ef;--muted:#abb5b0;--line:#37423d;--accent:#78c9ab;--accentText:#10221b;--soft:#294137;--shadow:0 12px 38px #0006}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,select,input,textarea{color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}a{color:var(--accent)}.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}.side{padding:26px 16px;border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:12px;margin:3px 10px 28px;font-size:18px;font-weight:750;letter-spacing:.03em}.logo{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--accent);color:var(--accentText);font-size:22px}.nav-title{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:20px 12px 8px}.nav{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;border:0;background:none;border-radius:10px;padding:10px 12px;margin:2px 0}.nav:hover,.nav.active{background:var(--soft);color:var(--accent)}.nav small{color:var(--muted)}.sidebar-actions{display:flex;gap:4px}.sidebar-actions button{border:0;background:none;padding:3px 5px;color:var(--muted)}.main{min-width:0}.top{position:sticky;top:0;z-index:4;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:18px 28px 14px}.toprow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:200px;position:relative}.search input{width:100%;padding:11px 13px 11px 38px;border:1px solid var(--line);border-radius:11px;background:var(--panel)}.search:before{content:'⌕';position:absolute;left:13px;top:4px;font-size:25px;color:var(--muted)}.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;white-space:nowrap}.btn:hover{border-color:var(--accent)}.primary{background:var(--accent);color:var(--accentText);border-color:var(--accent);font-weight:650}.danger{color:#bd4e4e}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px}.toolbar select,.toolbar input[type=range]{accent-color:var(--accent)}select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px}.status{margin-left:auto;color:var(--muted);font-size:12px}.content{padding:28px;max-width:1800px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px}.heading h1{font-size:28px;line-height:1.1;letter-spacing:-.035em;margin:0 0 5px}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,210px),1fr));gap:16px}.grid.masonry{display:block;columns:var(--col,4);column-gap:16px}.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #00000008;break-inside:avoid;margin-bottom:16px}.card:hover{box-shadow:var(--shadow)}.thumb{border:0;padding:0;background:color-mix(in srgb,var(--line) 50%,var(--panel));width:100%;height:205px;display:grid;place-items:center;overflow:hidden}.masonry .thumb{height:auto;min-height:160px}.thumb img{display:block;width:100%;height:100%;object-fit:contain}.masonry .thumb img{height:auto}.cardmeta{padding:10px 12px;display:flex;gap:8px;align-items:center}.cardtitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.iconbtn{border:0;background:none;padding:4px 6px;font-size:18px}.pick{position:absolute;top:9px;left:9px;z-index:1;width:20px;height:20px;accent-color:var(--accent)}.badge{position:absolute;top:8px;right:9px;padding:3px 7px;border-radius:7px;background:#161b1ad1;color:white;font-size:11px}.empty{border:1px dashed var(--line);background:var(--panel);border-radius:18px;text-align:center;padding:70px 20px;color:var(--muted)}.empty strong{display:block;font-size:20px;color:var(--ink);margin:12px}.batch{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border-radius:12px;background:var(--soft);margin-bottom:20px}.batch.show{display:flex}.toast{position:fixed;bottom:20px;right:20px;z-index:30;background:var(--ink);color:var(--bg);padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);max-width:min(500px,90vw)}dialog{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);width:min(650px,calc(100vw - 24px));max-height:90vh;overflow:auto;padding:24px}dialog::backdrop{background:#111b18ad}dialog h2{margin:0 0 16px;font-size:22px}dialog .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:12px 0}dialog label{display:block;font-weight:600;margin:13px 0 5px}dialog input:not([type=checkbox]):not([type=range]),dialog textarea,dialog select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}dialog textarea{min-height:80px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.fine{font-size:12px;color:var(--muted)}.notice{padding:12px;border-radius:10px;background:var(--soft);margin:12px 0}.progress{height:8px;background:var(--line);border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0}.viewer{position:fixed;inset:0;z-index:20;background:#0c100ff2;color:white;display:none;flex-direction:column}.viewer.open{display:flex}.vbar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#0006;z-index:2;flex-wrap:wrap}.vbar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vbar button{border:1px solid #ffffff30;background:#ffffff18;color:white;border-radius:8px;padding:7px 10px}.stage{flex:1;min-height:0;overflow:hidden;position:relative;touch-action:none;cursor:grab}.stage.dragging{cursor:grabbing}.stage img{position:absolute;max-width:none;transition:opacity .25s ease;transform-origin:0 0;user-select:none;pointer-events:none}.vfoot{padding:8px 16px;text-align:center;background:#0006;color:#e4e8e5}.conflict{padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0}.inline{display:inline-block}.mobileMenu{display:none}.sync-log{max-height:160px;overflow:auto;white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px;font-size:12px}.drop{outline:3px dashed var(--accent);outline-offset:-10px}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{display:none;position:fixed;z-index:8;top:0;left:0;width:240px;box-shadow:var(--shadow)}.side.open{display:block}.mobileMenu{display:inline-block}.top{padding:12px}.content{padding:20px 12px}.heading h1{font-size:24px}.grid{gap:10px}.card{margin-bottom:10px}.grid.masonry{columns:2}.thumb{height:155px}}@media(max-width:520px){.toprow .btn span{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));--tile:130px}.grid.masonry{columns:2}.status{width:100%;margin-left:0}.thumb{height:135px}.content{padding:16px 10px}.vbar{padding:7px}.vbar button{padding:6px}}
</style>
</head>
<body>
<div class="app" id="app">
<aside class="side" id="side"><div class="brand"><span class="logo">✦</span>手繪卡片收藏</div><div class="nav-title">收藏庫</div><div id="baseNav"></div><div class="nav-title">分類 <button class="iconbtn" id="addCategory" aria-label="新增分類">＋</button></div><div id="categoryNav"></div><div class="nav-title">標籤</div><div id="tagNav"></div><div class="nav-title">工具</div><button class="nav" data-view="drive">☁ Google Drive</button><button class="nav" data-view="settings">⚙ 設定與備份</button></aside>
<main class="main"><header class="top"><div class="toprow"><button class="btn mobileMenu" id="menu" aria-label="開啟導覽">☰</button><div class="search"><input id="search" type="search" placeholder="搜尋標題、檔名、描述、標籤… 類別:名稱 標籤:名稱" aria-label="搜尋卡片"></div><button class="btn primary" id="importBtn">＋ <span>匯入圖片</span></button><button class="btn" id="folderBtn">▣ <span>匯入資料夾</span></button><input id="fileInput" type="file" accept="image/*" multiple hidden><input id="folderInput" type="file" webkitdirectory multiple hidden></div><div class="toolbar"><select id="sort" aria-label="排序"><option value="created">最近新增</option><option value="updated">最近更新</option><option value="name">名稱</option><option value="size">檔案大小</option></select><label class="fine" for="tileSize">縮圖</label><input type="range" id="tileSize" min="140" max="300" value="210" aria-label="縮圖尺寸"><button class="btn" id="layout" aria-label="切換版面">▦ 方格</button><button class="btn" id="slideBtn">▶ 幻燈片</button><span class="status" id="syncStatus">本機模式</span></div></header>
<div class="content"><div class="heading"><div><h1 id="pageTitle">所有卡片</h1><div class="sub" id="pageSub">載入中…</div></div><button class="btn" id="selectAll">全選目前結果</button></div><div class="batch" id="batch"><strong id="selectedCount"></strong><button class="btn" id="batchCategory">移至分類</button><button class="btn" id="batchTags">設定標籤</button><button class="btn" id="batchFav">加入最愛</button><button class="btn" id="batchDownload">下載 ZIP</button><button class="btn danger" id="batchDelete">刪除</button><button class="btn" id="clearSelection">取消選取</button></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden><div style="font-size:42px">✧</div><strong id="emptyTitle">這裡還沒有卡片</strong><span id="emptyText">匯入圖片，開始建立你的手繪收藏。</span></div></div></main></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="圖片檢視器"><div class="vbar"><button id="vClose" aria-label="關閉">✕</button><button id="vPrev" aria-label="上一張">←</button><div class="grow" id="vTitle"></div><button id="vEdit">編輯</button><button id="vRotate">⟳</button><button id="vDownload">下載</button><button id="vFull">全螢幕</button><button id="vNext" aria-label="下一張">→</button></div><div class="stage" id="stage"><img id="vImage" alt=""></div><div class="vbar" style="justify-content:center"><button id="vMinus">−</button><button id="vFit">適合視窗</button><button id="vOne">原始尺寸</button><button id="vPlus">＋</button><span id="vScale" style="min-width:120px;text-align:center"></span><button id="vPlay">▶ 播放</button><button id="vStop">停止</button></div><div class="vfoot" id="vFoot"></div></div>
<dialog id="modal"></dialog><div class="toast" id="toast" role="status" hidden></div>
<script>
(()=>{'use strict';
const DB='handdrawn-card-gallery', VERSION=1, MAX_FILE=100*1024*1024, MAX_ZIP=2*1024*1024*1024, SCOPE='https://www.googleapis.com/auth/drive.file';
const $=s=>document.querySelector(s), uid=()=>crypto.randomUUID(), now=()=>new Date().toISOString(), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={db:null,cards:[],categories:[],settings:{},view:'all',viewId:null,selected:new Set(),urls:new Map(),viewerUrls:null,visible:[],viewerIndex:0,zoom:1,fit:1,x:0,y:0,rotation:0,playing:false,timer:null,token:null,tokenExpiry:0,tokenClient:null,syncing:false,syncProgress:0,syncStats:{success:0,fail:0},syncLog:[],conflicts:[],categoryConflicts:[],importCancel:false,importing:false};
function toast(msg){const e=$('#toast');e.textContent=msg;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,5500)}
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,VERSION);r.onupgradeneeded=()=>{const d=r.result;for(const name of ['cards','categories','settings','syncQueue','syncState'])if(!d.objectStoreNames.contains(name))d.createObjectStore(name,{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function tx(name,mode='readonly'){return state.db.transaction(name,mode).objectStore(name)}
async function all(name){return req(tx(name).getAll())}
async function get(name,id){return req(tx(name).get(id))}
async function put(name,value){return req(tx(name,'readwrite').put(value))}
async function del(name,id){return req(tx(name,'readwrite').delete(id))}
async function setting(id,value){state.settings[id]=value;await put('settings',{id,value})}
async function load(){state.cards=await all('cards');state.categories=(await all('categories')).filter(c=>!c.deletedAt);state.settings=Object.fromEntries((await all('settings')).map(x=>[x.id,x.value]));$('#sort').value=state.settings.sort||'created';$('#tileSize').value=state.settings.tileSize||210;document.documentElement.dataset.theme=state.settings.theme||'light';$('#grid').classList.toggle('masonry',!!state.settings.masonry);setTile();render();if(state.cards.some(c=>!c.deletedAt)&&(!state.settings.lastBackup||Date.now()-Date.parse(state.settings.lastBackup)>30*86400000))toast('建議匯出 ZIP 備份；IndexedDB 不是永久備份')}
function setTile(){const n=Number($('#tileSize').value);$('#grid').style.setProperty('--tile',n+'px');$('#grid').style.setProperty('--col',Math.max(2,Math.floor((innerWidth-270)/(n+16))))}
function categoryName(id){return state.categories.find(x=>x.id===id)?.name||'未分類'}
function tokens(q){return q.toLowerCase().trim().split(/\s+/).filter(Boolean)}
function match(c,q){const cat=categoryName(c.categoryId).toLowerCase(),tags=(c.tags||[]).join(' ').toLowerCase(),full=[c.title,c.filename,c.description,c.relativePath,cat,tags].join(' ').toLowerCase();return tokens(q).every(t=>t.startsWith('類別:')?cat.includes(t.slice(3)):t.startsWith('標籤:')?tags.includes(t.slice(3)):full.includes(t))}
function filtered(){let a=state.cards.filter(c=>!c.deletedAt);if(state.view==='recent')a=a.filter(c=>Date.now()-Date.parse(c.createdAt)<30*86400000);if(state.view==='favorite')a=a.filter(c=>c.favorite);if(state.view==='category')a=a.filter(c=>c.categoryId===state.viewId);if(state.view==='tag')a=a.filter(c=>(c.tags||[]).includes(state.viewId));const q=$('#search').value;if(q)a=a.filter(c=>match(c,q));const s=$('#sort').value;a.sort((x,y)=>s==='name'?x.title.localeCompare(y.title,'zh-Hant'):s==='size'?y.fileSize-x.fileSize:Date.parse(y[s==='updated'?'updatedAt':'createdAt'])-Date.parse(x[s==='updated'?'updatedAt':'createdAt']));return a}
function cardUrl(c){if(!state.urls.has(c.id))state.urls.set(c.id,URL.createObjectURL(c.thumbnailBlob||c.originalBlob));return state.urls.get(c.id)}
function clearUrls(){for(const u of state.urls.values())URL.revokeObjectURL(u);state.urls.clear()}
function nav(){const base=[['all','▦ 所有卡片'],['recent','◷ 最近新增'],['favorite','♡ 我的最愛']];$('#baseNav').innerHTML=base.map(([v,n])=>`<button class="nav ${state.view===v?'active':''}" data-view="${v}"><span>${n}</span><small>${state.cards.filter(c=>!c.deletedAt&&(v==='favorite'?c.favorite:v==='recent'?Date.now()-Date.parse(c.createdAt)<30*86400000:true)).length}</small></button>`).join('');$('#categoryNav').innerHTML=state.categories.map(c=>`<div class="row" style="display:flex;align-items:center"><button class="nav ${state.view==='category'&&state.viewId===c.id?'active':''}" data-category="${esc(c.id)}" style="flex:1"><span>◫ ${esc(c.name)}</span><small>${state.cards.filter(x=>!x.deletedAt&&x.categoryId===c.id).length}</small></button><button class="iconbtn" data-category-edit="${esc(c.id)}" aria-label="編輯 ${esc(c.name)}">⋯</button></div>`).join('')||'<div class="fine" style="padding:0 12px">尚無分類</div>';const counts=new Map();state.cards.filter(c=>!c.deletedAt).forEach(c=>(c.tags||[]).forEach(t=>counts.set(t,(counts.get(t)||0)+1)));$('#tagNav').innerHTML=[...counts].sort().map(([t,n])=>`<button class="nav ${state.view==='tag'&&state.viewId===t?'active':''}" data-tag="${esc(t)}"><span># ${esc(t)}</span><small>${n}</small></button>`).join('')||'<div class="fine" style="padding:0 12px">尚無標籤</div>';document.querySelectorAll('[data-view]').forEach(e=>e.classList.toggle('active',e.dataset.view===state.view))}
function render(){nav();const a=filtered();state.visible=a;const names={all:'所有卡片',recent:'最近新增',favorite:'我的最愛',category:categoryName(state.viewId),tag:'#'+state.viewId,drive:'Google Drive',settings:'設定與備份'};$('#pageTitle').textContent=names[state.view]||'所有卡片';$('#pageSub').textContent=`${a.length} 張卡片 · 本機收藏庫`;const grid=$('#grid');clearUrls();grid.innerHTML='';if(state.view==='settings'){renderSettings();return}if(state.view==='drive'){renderDrive();return}for(const c of a){const el=document.createElement('article');el.className='card';const chk=document.createElement('input');chk.type='checkbox';chk.className='pick';chk.checked=state.selected.has(c.id);chk.setAttribute('aria-label','選取 '+c.title);chk.onchange=()=>{chk.checked?state.selected.add(c.id):state.selected.delete(c.id);renderBatch()};const btn=document.createElement('button');btn.className='thumb';btn.setAttribute('aria-label','檢視 '+c.title);const img=document.createElement('img');img.src=cardUrl(c);img.alt=c.title;img.loading='lazy';btn.append(img);btn.onclick=()=>openViewer(c.id);const meta=document.createElement('div');meta.className='cardmeta';const name=document.createElement('span');name.className='cardtitle';name.textContent=c.title;const fav=document.createElement('button');fav.className='iconbtn';fav.textContent=c.favorite?'♥':'♡';fav.setAttribute('aria-label',c.favorite?'取消最愛':'加入最愛');fav.onclick=async()=>{await editCard(c,{favorite:!c.favorite});render()};meta.append(name,fav);el.append(chk,btn,meta);grid.append(el)}$('#empty').hidden=a.length>0;$('#emptyTitle').textContent=state.cards.length?'沒有符合條件的卡片':'這裡還沒有卡片';$('#emptyText').textContent=state.cards.length?'試試其他搜尋或分類。':'匯入圖片，開始建立你的手繪收藏。';renderBatch();updateSyncStatus()}
function renderBatch(){const n=state.selected.size;$('#batch').classList.toggle('show',n>0);$('#selectedCount').textContent=`已選 ${n} 張`}
function showModal(title,html,onOpen){const d=$('#modal');d.innerHTML=`<h2>${esc(title)}</h2>${html}`;d.showModal();onOpen?.(d);return d}
function closeModal(){if($('#modal').open)$('#modal').close()}
function selectedCards(){return state.cards.filter(c=>state.selected.has(c.id)&&!c.deletedAt)}
async function queue(c,op='upsert'){await put('syncQueue',{id:c.id,op,at:now()});scheduleAutoSync()}
function scheduleAutoSync(){if(!state.settings.autoSync||!state.token||state.syncing||state.importing||!navigator.onLine)return;clearTimeout(scheduleAutoSync.timer);scheduleAutoSync.timer=setTimeout(()=>sync().catch(e=>log('自動同步失敗：'+e.message)),1800)}
async function editCard(c,changes){Object.assign(c,changes,{updatedAt:now(),localRevision:(c.localRevision||0)+1,syncState:'pending'});await put('cards',c);await queue(c)}
function safeName(s){return String(s||'image').normalize('NFC').replace(/[\\/\x00-\x1f<>:"|?*]/g,'_').slice(0,150)||'image'}
async function hash(blob){const b=await blob.arrayBuffer();return [...new Uint8Array(await crypto.subtle.digest('SHA-256',b))].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function decode(file){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);resolve(i)};i.onerror=()=>{URL.revokeObjectURL(u);reject(Error('圖片無法解碼'))};i.src=u})}
async function thumb(file){const i=await decode(file);const w=i.naturalWidth,h=i.naturalHeight;if(!w||!h||w*h>100000000)throw Error('圖片尺寸異常');const f=Math.min(1,400/Math.max(w,h)),can=document.createElement('canvas');can.width=Math.max(1,Math.round(w*f));can.height=Math.max(1,Math.round(h*f));can.getContext('2d').drawImage(i,0,0,can.width,can.height);const b=await new Promise(r=>can.toBlob(r,'image/webp',.82));return {blob:b||file,width:w,height:h}}
function validImage(file){return /^image\/(jpeg|png|webp|gif|bmp|avif)$/i.test(file.type)&&file.size>0&&file.size<=MAX_FILE}

async function restoreZip(file){

      const existing=await get('categories',item.id);
      if(existing&&!existing.deletedAt&&existing.name===item.name){categoryMap.set(item.id,item.id);continue}
      const prior=state.categories.find(x=>x.restoredFromId===item.id&&x.name===item.name);
      if(prior){categoryMap.set(item.id,prior.id);continue}
      const id=existing?uid():item.id;
      const category={id,name:item.name,createdAt:validDate(item.createdAt),localRevision:1,baseRevision:0,deletedAt:null,restoredFromId:existing?item.id:null};
      await put('categories',category);state.categories.push(category);categoryMap.set(item.id,id);

      const item=m.cards[i];
      d.querySelector('#restoreText').textContent=`${i+1} / ${m.cards.length} · 成功 ${ok} · 略過相同 ${skipped} · 錯誤 ${errors.length}`;
      d.querySelector('#restoreBar').style.width=((i+1)/m.cards.length*100)+'%';
      try{
        const rawImg=zip.get(item.imagePath);
        if(!rawImg)throw Error('缺少圖片');
        const blob=new Blob([rawImg],{type:item.mimeType});
        if(blob.size!==item.fileSize||await hash(blob)!==item.sha256)throw Error('原圖大小或 SHA-256 不符');
        const t=await thumb(blob);
        const categoryId=categoryMap.get(item.categoryId)||null;
        const backup={...item,categoryId};
        const existing=state.cards.find(x=>x.id===item.id);
        const restoreKey=JSON.stringify([item.title,item.description||'',categoryId,item.tags,item.favorite,item.sha256]);
        if(existing&&sameBackupCard(existing,backup)||state.cards.some(x=>!x.deletedAt&&x.restoredFromId===item.id&&x.restoreKey===restoreKey)){skipped++;continue}
        const id=existing?uid():item.id;
        const card={
          id,title:String(item.title||item.filename).slice(0,200)+(existing?'（備份版本）':''),filename:safeName(item.filename),
          description:String(item.description||'').slice(0,5000),categoryId,
          tags:item.tags.filter(x=>typeof x==='string').map(x=>x.slice(0,80)),favorite:!!item.favorite,
          mimeType:item.mimeType,fileSize:blob.size,width:t.width,height:t.height,sha256:item.sha256,
          relativePath:safePath(item.relativePath||''),createdAt:validDate(item.createdAt),updatedAt:now(),
          localRevision:1,baseRevision:0,driveFileId:null,driveVersion:null,syncState:'pending',deletedAt:null,
          originalBlob:blob,thumbnailBlob:t.blob,restoredFromId:existing?item.id:null,restoreKey:existing?restoreKey:null
        };
        await put('cards',card);await queue(card);state.cards.push(card);ok++;
      }catch(e){errors.push(`${item.filename}: ${e.message}`)}
      if(i%4===0)await new Promise(r=>setTimeout(r,0));
    }
    closeModal();render();
    showModal('還原結果',`<p>成功還原 ${ok} 張；略過完全相同 ${skipped} 張；錯誤 ${errors.length} 張。</p>${errors.length?`<div class="sync-log">${esc(errors.join('\n'))}</div>`:''}<div class="dialog-actions"><button class="btn primary" id="done">完成</button></div>`,x=>x.querySelector('#done').onclick=closeModal);
  }catch(e){closeModal();toast('還原失敗：'+e.message)}
  finally{state.importing=false;scheduleAutoSync()}
}

      try{
        if(!c.deletedAt&&!c.driveFileId){
          const f=await createFile({name:c.id+'-'+safeName(c.filename),parents:[ids.images],mimeType:c.mimeType,appProperties:{cardId:c.id,libraryId:state.settings.libraryId}},c.originalBlob);
          c.driveFileId=f.id;c.driveVersion=f.version;await put('cards',c);
        }else if(!c.deletedAt&&c.driveFileId&&nextCards.get(c.id)?.sha256!==c.sha256){
          const f=await updateFile(c.driveFileId,{name:c.id+'-'+safeName(c.filename),mimeType:c.mimeType},c.originalBlob);
          c.driveVersion=f.version;await put('cards',c);
        }
        const revision=Math.max(c.localRevision,(nextCards.get(c.id)?.revision||0)+1);
        nextCards.set(c.id,{...cloudRecord(c),revision});success++;
      }catch(e){fail++;log('上傳失敗：'+c.title+'：'+e.message)}
      state.syncProgress=55+Math.round(30*(uploadIndex+1)/uploads.length);state.syncStats={success,fail};updateSyncStatus();
    }
    if(fail)throw Error(`${fail} 筆傳輸失敗，metadata 未提交；可稍後重試`);
    const nextCategories=new Map(remote.categories.map(c=>[c.id,c]));
    for(const c of categoryUploads){
      const revision=Math.max(c.localRevision,(nextCategories.get(c.id)?.revision||0)+1);
      nextCategories.set(c.id,categoryRecord(c,revision));
    }
    if(libFile&&!uploads.length&&!categoryUploads.length){
      const check=await getFile(libFile.id);
      if(String(check.version)!==String(libFile.version))throw Error('雲端 metadata 已被另一裝置修改，請重新同步');
      state.syncProgress=100;state.syncStats={success,fail};await setting('lastSync',now());log(`同步完成：讀取 ${success} 筆；雲端版本 ${libFile.version}，未改寫 metadata`);return;
    }
    const payload={schemaVersion:1,libraryId:state.settings.libraryId,cards:[...nextCards.values()],categories:[...nextCategories.values()],commitId:uid(),updatedAt:now()};
    const check=libFile?await getFile(libFile.id):null;
    if(libFile&&String(check.version)!==String(libFile.version))throw Error('雲端 metadata 已被另一裝置修改；本次未提交，請重新同步');
    const body=new Blob([JSON.stringify(payload)],{type:'application/json'});
    const saved=libFile?await updateFile(libFile.id,{name:'library.json',mimeType:'application/json'},body):await createFile({name:'library.json',parents:[ids.meta],mimeType:'application/json',appProperties:{libraryId:state.settings.libraryId}},body);
    ids.library=saved.id;await setting('driveIds',ids);
    state.syncProgress=90;updateSyncStatus();
    const actual=JSON.parse(await(await getMedia(saved.id,20*1024*1024)).text());
    if(actual.commitId!==payload.commitId)throw Error('雲端提交後驗證失敗，可能有另一裝置覆寫；請重新同步並檢查 ZIP 備份');
    for(const c of uploads){c.baseRevision=nextCards.get(c.id).revision;c.localRevision=c.baseRevision;c.syncState='synced';await put('cards',c)}
    for(const c of categoryUploads){c.baseRevision=nextCategories.get(c.id).revision;c.localRevision=c.baseRevision;await put('categories',c)}
    for(const item of await all('syncQueue'))await del('syncQueue',item.id);
    state.syncProgress=100;state.syncStats={success,fail};await setting('lastSync',now());log(`同步完成：處理 ${success} 筆；Drive metadata 版本 ${saved.version}，檔案 ID ${saved.id}`);
  }catch(e){state.syncStats={success,fail};log('同步未完成：'+e.message);throw e}
  finally{state.syncing=false;render();updateSyncStatus()}
}
function renderConflicts(){
  const box=$('#conflicts');if(!box)return;
  const cards=state.conflicts.map((x,i)=>`<div class="conflict"><strong>${esc(x.local.title)}</strong><div class="fine">本機修訂 ${x.local.localRevision} · 雲端修訂 ${x.remote.revision}</div><div class="row"><button class="btn" data-resolution="local" data-i="${i}">保留本機</button><button class="btn" data-resolution="remote" data-i="${i}">保留雲端</button><button class="btn" data-resolution="both" data-i="${i}">保留兩個版本</button></div></div>`).join('');
  const categories=state.categoryConflicts.map((x,i)=>`<div class="conflict"><strong>分類：${esc(x.local.name)}</strong><div class="fine">本機：${x.local.deletedAt?'已刪除':esc(x.local.name)} · 雲端：${x.remote.deletedAt?'已刪除':esc(x.remote.name)}</div><div class="row"><button class="btn" data-category-resolution="local" data-i="${i}">保留本機分類</button><button class="btn" data-category-resolution="remote" data-i="${i}">保留雲端分類</button></div></div>`).join('');
  box.innerHTML=cards+categories;
}
async function resolveCategoryConflict(i,mode){
  const x=state.categoryConflicts[i];if(!x)return;
  const c=x.local,r=x.remote;
  if(mode==='remote')await applyRemoteCategory(r,c);
  else{c.baseRevision=r.revision;c.localRevision=Math.max(c.localRevision,r.revision)+1;await put('categories',c)}
  state.categoryConflicts.splice(i,1);
  log('已處理分類衝突；請重新同步');render();
}
async function resolveConflict(i,mode){const x=state.conflicts[i];if(!x)return;const c=x.local,r=x.remote;if(mode==='remote'){if(r.deletedAt){c.deletedAt=r.deletedAt;c.baseRevision=r.revision;c.localRevision=r.revision;c.syncState='synced';await put('cards',c)}else{const downloaded=await downloadCloud(r);Object.assign(c,downloaded);await put('cards',c)}await del('syncQueue',c.id)}else if(mode==='local'){c.baseRevision=r.revision;c.localRevision=Math.max(c.localRevision,r.revision)+1;c.syncState='pending';await put('cards',c);await queue(c)}else{if(!r.deletedAt){const copy=await downloadCloud(r);copy.id=uid();copy.title+='（雲端版本）';copy.driveFileId=null;copy.driveVersion=null;copy.baseRevision=0;copy.localRevision=1;copy.syncState='pending';await put('cards',copy);await queue(copy);state.cards.push(copy)}c.baseRevision=r.revision;c.localRevision=Math.max(c.localRevision,r.revision)+1;c.syncState='pending';await put('cards',c);await queue(c)}state.conflicts.splice(i,1);log('已處理衝突：'+c.title+'；請重新同步');render()}
async function init(){try{state.db=await openDB();await load();if(!state.settings.libraryId)await setting('libraryId',uid());if(!cloudAvailable())toast('file:// 可離線使用；Google Drive 需 HTTPS 或 localhost。請定期匯出 ZIP。')}catch(e){showModal('無法啟動本機收藏庫',`<p>${esc(e.message)}</p><p>請確認瀏覽器允許 IndexedDB。file:// 的持久性因瀏覽器而異；建議使用 localhost。</p>`)}}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]'),cat=e.target.closest('[data-category]'),tag=e.target.closest('[data-tag]'),edit=e.target.closest('[data-category-edit]'),res=e.target.closest('[data-resolution]'),catRes=e.target.closest('[data-category-resolution]');if(v){state.view=v.dataset.view;state.viewId=null;$('#side').classList.remove('open');render()}if(cat){state.view='category';state.viewId=cat.dataset.category;$('#side').classList.remove('open');render()}if(tag){state.view='tag';state.viewId=tag.dataset.tag;$('#side').classList.remove('open');render()}if(edit)editCategory(edit.dataset.categoryEdit);if(res)resolveConflict(Number(res.dataset.i),res.dataset.resolution).catch(x=>toast(x.message));if(catRes)resolveCategoryConflict(Number(catRes.dataset.i),catRes.dataset.categoryResolution).catch(x=>toast(x.message))});
$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{const files=[...e.target.files];e.target.value='';chooseImport(files)};$('#folderBtn').onclick=()=>{if(!('webkitdirectory'in $('#folderInput')))return toast('此瀏覽器不支援資料夾選取，請改用多檔匯入');$('#folderInput').click()};$('#folderInput').onchange=e=>{const files=[...e.target.files];e.target.value='';chooseImport(files,true)};$('#search').oninput=render;$('#sort').onchange=e=>{setting('sort',e.target.value);render()};$('#tileSize').oninput=setTile;$('#tileSize').onchange=e=>setting('tileSize',Number(e.target.value));$('#layout').onclick=()=>{const x=!$('#grid').classList.contains('masonry');$('#grid').classList.toggle('masonry',x);$('#layout').textContent=x?'▥ 瀑布流':'▦ 方格';setting('masonry',x)};$('#addCategory').onclick=createCategory;$('#selectAll').onclick=()=>{for(const c of state.visible)state.selected.add(c.id);render()};$('#clearSelection').onclick=()=>{state.selected.clear();render()};for(const k of ['Category','Tags','Fav','Download','Delete'])$('#batch'+k).onclick=()=>batchAction(k.toLowerCase());$('#slideBtn').onclick=()=>{showModal('開始幻燈片',`<label>播放範圍</label><select id="slideScope"><option value="current">目前搜尋或分類結果</option><option value="all">所有卡片</option><option value="favorite">我的最愛</option><option value="selected">已選取項目</option></select><div class="dialog-actions"><button class="btn" id="cancel">取消</button><button class="btn primary" id="start">開始播放</button></div>`,d=>{d.querySelector('#cancel').onclick=closeModal;d.querySelector('#start').onclick=()=>{const scope=d.querySelector('#slideScope').value;const cards=scope==='all'?state.cards.filter(c=>!c.deletedAt):scope==='favorite'?state.cards.filter(c=>!c.deletedAt&&c.favorite):scope==='selected'?selectedCards():filtered();if(!cards.length)return toast('此範圍沒有卡片');closeModal();state.visible=cards;openViewer(cards[0].id);toggleSlide()}})};
$('#vClose').onclick=closeViewer;$('#vPrev').onclick=()=>step(-1);$('#vNext').onclick=()=>step(1);$('#vEdit').onclick=editCurrent;$('#vRotate').onclick=()=>{state.rotation=(state.rotation+90)%360;fitImage()};$('#vDownload').onclick=()=>{const c=current();if(c)download(c.originalBlob,c.filename)};$('#vFull').onclick=()=>{document.fullscreenElement?document.exitFullscreen():$('#viewer').requestFullscreen?.()};$('#vMinus').onclick=()=>setZoom(state.zoom/1.25);$('#vPlus').onclick=()=>setZoom(state.zoom*1.25);$('#vFit').onclick=fitImage;$('#vOne').onclick=()=>setZoom(1);$('#vPlay').onclick=toggleSlide;$('#vStop').onclick=stopSlide;
const stage=$('#stage');let drag=null,pointers=new Map(),pinch=0;stage.onwheel=e=>{e.preventDefault();const r=stage.getBoundingClientRect();setZoom(state.zoom*(e.deltaY<0?1.14:1/1.14),e.clientX-r.left,e.clientY-r.top)};stage.onpointerdown=e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY};stage.classList.add('dragging')};stage.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const ps=[...pointers.values()],dist=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(pinch){const r=stage.getBoundingClientRect();setZoom(state.zoom*dist/pinch,(ps[0].x+ps[1].x)/2-r.left,(ps[0].y+ps[1].y)/2-r.top)}pinch=dist}else if(drag){state.x+=e.clientX-drag.x;state.y+=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};drawViewer()}};const endPointer=e=>{pointers.delete(e.pointerId);pinch=0;drag=null;stage.classList.remove('dragging')};stage.onpointerup=endPointer;stage.onpointercancel=endPointer;stage.ondblclick=e=>{const r=stage.getBoundingClientRect();setZoom(state.zoom>state.fit*1.5?state.fit:state.fit*2,e.clientX-r.left,e.clientY-r.top)};document.addEventListener('keydown',e=>{if(!$('#viewer').classList.contains('open')||$('#modal').open||/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName))return;const k=e.key;if(['ArrowLeft','ArrowRight','Escape','+','-','0','f','F'].includes(k))e.preventDefault();if(k==='ArrowLeft')step(-1);if(k==='ArrowRight')step(1);if(k==='Escape')closeViewer();if(k==='+')setZoom(state.zoom*1.25);if(k==='-')setZoom(state.zoom/1.25);if(k==='0')fitImage();if(k.toLowerCase()==='f')$('#vFull').click()});document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(state.timer);else if(state.playing)scheduleSlide()});window.addEventListener('resize',()=>{setTile();if($('#viewer').classList.contains('open'))fitImage()});document.addEventListener('dragover',e=>{e.preventDefault();$('#app').classList.add('drop')});document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('#app').classList.remove('drop')});document.addEventListener('drop',e=>{e.preventDefault();$('#app').classList.remove('drop');if(e.dataTransfer?.files?.length)chooseImport(e.dataTransfer.files)});window.addEventListener('online',()=>{if(state.settings.autoSync&&state.token)sync().catch(e=>log('自動同步失敗：'+e.message))});init();
